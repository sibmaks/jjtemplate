name: Feature request
description: Suggest an improvement or new capability for JJTemplate
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to suggest an improvement to JJTemplate.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the problem you want to solve and why it matters.
      placeholder: I need to... because...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like JJTemplate to provide.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: Show how the proposed feature could look in a JJT template or Java API, if applicable.
      render: text

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative solutions you considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other details, links, or examples that support the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
